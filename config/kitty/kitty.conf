# ╔══════════════════════════════════════════════════════════════════╗
# ║  [K-CORE] KITTY TERMINAL — TELEMETRY DATA CONSOLE             ║
# ║  LIGHT PALETTE / NO DECORATION / DENSE MONOSPACE               ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── TYPOGRAPHY ─────────────────────────────────────────────────────
font_family      family="Monaspace Krypton" style=Regular
bold_font        family="Monaspace Krypton" style=Bold
italic_font      family="Monaspace Krypton" style=Italic
bold_italic_font family="Monaspace Krypton" style="Bold Italic"
font_size        11.5

# Enable ligatures & Texture Healing (Monaspace specific)
disable_ligatures never
font_features MonaspaceKrypton-Regular +calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08
font_features MonaspaceKrypton-Bold +calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08
font_features MonaspaceKrypton-Italic +calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08
font_features MonaspaceKrypton-BoldItalic +calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08

# ── GEOMETRY ───────────────────────────────────────────────────────
# Padding inside the terminal
window_padding_width 16

# Margins outside the border
window_margin_width 4

# Black Brutalist Border around the window
window_border_width 4pt
active_border_color #111111
inactive_border_color #111111
draw_minimal_borders no

# Allow OS window decorations so the window manager draws the border (like it does for Firefox)
hide_window_decorations no

# Remember window size
remember_window_size yes
initial_window_width  120c
initial_window_height 36c

# ── TAB BAR: DISABLED ─────────────────────────────────────────────
tab_bar_style hidden

# ── CURSOR ─────────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0
cursor_text_color     background

# ── SCROLLBACK ─────────────────────────────────────────────────────
scrollback_lines 10000

# ── BELL ───────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0

# ── COLOR PALETTE (LIGHT TELEMETRY) ───────────────────────────────
foreground #111111
background #f4f4f4

# Cursor
cursor     #111111

# Selection
selection_foreground #f4f4f4
selection_background #0055ff

# URL
url_color  #0055ff
url_style  single

# ── 16-COLOR PALETTE ──────────────────────────────────────────────
# Black (dark/light)
color0  #111111
color8  #555555

# Red (dark/light)
color1  #ff3300
color9  #ff5533

# Green (dark/light)
color2  #00aa55
color10 #33cc77

# Yellow (dark/light)
color3  #aa8800
color11 #ccaa22

# Blue (dark/light)
color4  #0055ff
color12 #3377ff

# Magenta (dark/light)
color5  #8833cc
color13 #aa55ee

# Cyan (dark/light)
color6  #0099aa
color14 #33bbcc

# White (dark/light)
color7  #cccccc
color15 #f4f4f4

# ── CURSOR TRAIL (CRT PHOSPHOR EFFECT) ─────────────────────────────
# Simulates old teletype and CRT monitors with a typing trail
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ── ADVANCED ───────────────────────────────────────────────────────
confirm_os_window_close 0
allow_remote_control    yes
listen_on               unix:/tmp/kitty-sock

# Shell integration
shell_integration enabled
