conky.text = [[
#
# ══════════════════════════════════════════════════════════════════
#  SYSTEM HEADER
# ══════════════════════════════════════════════════════════════════
${color1}${font1}╔══════════════════════════════════════════╗${font}
${color1}${font1}║${color0}  [MARKAB] CENTRAL TELEMETRY DASHBOARD    ${color1}║${font}
${color1}${font1}╚══════════════════════════════════════════╝${font}
${color3}${hr 1}${color0}
${font0}  SYSTEM     ${color1}>${color0} ${nodename}${alignr}${sysname} ${kernel}
  UPTIME     ${color1}>${color0} ${uptime}${alignr}LOAD ${loadavg 1} ${loadavg 2} ${loadavg 3}
  SESSION    ${color1}>${color0} ${exec echo $XDG_SESSION_TYPE}${alignr}${time %Y.%m.%d  %H:%M:%S}
${color3}${hr 1}${color0}${font}
#
# ══════════════════════════════════════════════════════════════════
#  CPU TELEMETRY
# ══════════════════════════════════════════════════════════════════
${color1}${font1}┌─ CPU TELEMETRY ─────────────────────────┐${font}${color0}
${font0}  PROCESSOR  ${color1}>${color0} ${exec cat /proc/cpuinfo | grep 'model name' | head -1 | cut -d: -f2 | sed 's/^ //' | cut -c1-30}
  FREQUENCY  ${color1}>${color0} ${freq_g}GHz${alignr}GOVERNOR: ${exec cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || echo N/A}
  AGGREGATE  ${color1}>${color0} ${cpu}%${alignr}THREADS: ${exec nproc}${font}
${color3}  ── PER-CORE LOAD ──────────────────────────────${color0}
${font2}  C0 ${color1}${cpubar cpu1 6,50}${color0}  ${cpu cpu1}%    C1 ${color1}${cpubar cpu2 6,50}${color0}  ${cpu cpu2}%    C2 ${color1}${cpubar cpu3 6,50}${color0}  ${cpu cpu3}%
  C3 ${color1}${cpubar cpu4 6,50}${color0}  ${cpu cpu4}%    C4 ${color1}${cpubar cpu5 6,50}${color0}  ${cpu cpu5}%    C5 ${color1}${cpubar cpu6 6,50}${color0}  ${cpu cpu6}%${font0}
${color3}  ── CPU UTILIZATION GRAPH ──────────────────────${color0}
${color0}${cpugraph cpu0 40,440 111111 0055ff -l}
${color1}${font1}└─────────────────────────────────────────┘${font}${color0}
#
# ══════════════════════════════════════════════════════════════════
#  MEMORY BANK
# ══════════════════════════════════════════════════════════════════
${color5}${font1}┌─ MEMORY BANK ───────────────────────────┐${font}${color0}
${font0}  RAM USED   ${color5}>${color0} ${mem} / ${memmax}${alignr}[${memperc}%]
  ${color5}${membar 6,440}${color0}
  SWAP USED  ${color5}>${color0} ${swap} / ${swapmax}${alignr}[${swapperc}%]
  ${color5}${swapbar 6,440}${color0}
${color3}  ── MEMORY GRAPH ──────────────────────────────${color0}
${color0}${memgraph 40,440 111111 00aa55 -l}
${color5}${font1}└─────────────────────────────────────────┘${font}${color0}
#
# ══════════════════════════════════════════════════════════════════
#  THERMAL MONITOR
# ══════════════════════════════════════════════════════════════════
${color2}${font1}┌─ THERMAL MONITOR ──────────────────────┐${font}${color0}
${font0}  CPU TEMP   ${color2}>${color0} ${hwmon 1 temp 1}°C${alignr}${if_match ${hwmon 1 temp 1} > 80}${color2}!! THERMAL ALERT !!${color0}${else}NOMINAL${endif}
  ${color2}${execbar echo $(( $(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || echo 40000) / 1000 ))}${color0}
${color2}${font1}└─────────────────────────────────────────┘${font}${color0}
#
# ══════════════════════════════════════════════════════════════════
#  DISK I/O
# ══════════════════════════════════════════════════════════════════
${color3}${font1}┌─ DISK I/O ──────────────────────────────┐${font}${color0}
${font0}  ROOT  /    ${color3}>${color0} ${fs_used /} / ${fs_size /}${alignr}[${fs_used_perc /}%]
  ${color4}${fs_bar 6,440 /}${color0}
  READ       ${color1}>${color0} ${diskio_read}${alignr}WRITE ${color2}>${color0} ${diskio_write}
${color0}${diskiograph 30,440 111111 0055ff -l}
${color3}${font1}└─────────────────────────────────────────┘${font}${color0}
#
# ══════════════════════════════════════════════════════════════════
#  NETWORK TELEMETRY
# ══════════════════════════════════════════════════════════════════
${color1}${font1}┌─ NETWORK TELEMETRY ────────────────────┐${font}${color0}
${font0}  INTERFACE  ${color1}>${color0} ${gw_iface}${alignr}GW: ${gw_ip}
  LOCAL IP   ${color1}>${color0} ${addrs ${gw_iface}}${alignr}DNS: ${nameserver}
  DOWN       ${color5}>${color0} ${downspeed ${gw_iface}}${alignr}UP ${color2}>${color0} ${upspeed ${gw_iface}}
${color3}  ── THROUGHPUT ────────────────────────────────${color0}
${color0}${downspeedgraph ${gw_iface} 25,215 111111 00aa55 -l}  ${upspeedgraph ${gw_iface} 25,215 111111 ff3300 -l}
${color1}${font1}└─────────────────────────────────────────┘${font}${color0}
#
# ══════════════════════════════════════════════════════════════════
#  TOP PROCESSES
# ══════════════════════════════════════════════════════════════════
${color0}${font1}┌─ TOP PROCESSES ─────────────────────────┐${font}
${font2}  NAME${alignr}PID       CPU%   MEM%${font0}
${color3}${hr 1}${color0}
${font2}  ${top name 1}${alignr}${top pid 1}  ${top cpu 1}%  ${top mem 1}%
  ${top name 2}${alignr}${top pid 2}  ${top cpu 2}%  ${top mem 2}%
  ${top name 3}${alignr}${top pid 3}  ${top cpu 3}%  ${top mem 3}%
  ${top name 4}${alignr}${top pid 4}  ${top cpu 4}%  ${top mem 4}%
  ${top name 5}${alignr}${top pid 5}  ${top cpu 5}%  ${top mem 5}%
  ${top name 6}${alignr}${top pid 6}  ${top cpu 6}%  ${top mem 6}%
  ${top name 7}${alignr}${top pid 7}  ${top cpu 7}%  ${top mem 7}%
  ${top name 8}${alignr}${top pid 8}  ${top cpu 8}%  ${top mem 8}%${font}
${color0}${font1}└─────────────────────────────────────────┘${font}
#
# ══════════════════════════════════════════════════════════════════
#  SIMULATED RADAR / SIGNAL PULSE
# ══════════════════════════════════════════════════════════════════
${color3}${font2}  ╭──────────────────────────────────────╮
  │          MARKAB SIGNAL PULSE          │
  │  ${color1}>>--${color0}${exec awk 'BEGIN{srand(); s=""; for(i=0;i<28;i++){r=int(rand()*4); if(r==0)s=s"▁"; else if(r==1)s=s"▃"; else if(r==2)s=s"▅"; else s=s"▇"} print s}'}${color3}--<<  │
  │  ${color1}>>--${color0}${exec awk 'BEGIN{srand(); s=""; for(i=0;i<28;i++){r=int(rand()*4); if(r==0)s=s"▇"; else if(r==1)s=s"▅"; else if(r==2)s=s"▃"; else s=s"▁"} print s}'}${color3}--<<  │
  │  ${color1}>>--${color0}${exec awk 'BEGIN{srand(); s=""; for(i=0;i<28;i++){r=int(rand()*4); if(r==0)s=s"▁"; else if(r==1)s=s"▃"; else if(r==2)s=s"▅"; else s=s"▇"} print s}'}${color3}--<<  │
  ╰──────────────────────────────────────╯${color0}${font}
#
# ══════════════════════════════════════════════════════════════════
#
#  SIMULATED RADAR / SIGNAL PULSE
${color3}${font2}  MARKAB TELEMETRY v1.0 // ALL SYSTEMS NOMINAL // ${time %H:%M:%S}${font}${color0}
#
# ══════════════════════════════════════════════════════════════════
#  GIT CONTRIBUTION HEATMAP (REPEAT BOARD)
# ══════════════════════════════════════════════════════════════════
${exec /usr/bin/python3 DEFAULT_USER_HOME/.config/conky/git_heatmap.py 2>/dev/null}\
${image /dev/shm/git_heatmap.png -p 0,1120 -s 460x140 -f 1}
]]
