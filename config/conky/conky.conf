conky.config = {
    -- ── WINDOW: ROOT DESKTOP OVERLAY ──────────────────────────────
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_colour = '#f4f4f4',
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- ── GEOMETRY ──────────────────────────────────────────────────
    alignment = 'top_left',
    gap_x = 60,
    gap_y = 60,
    minimum_width = 460,
    maximum_width = 460,
    minimum_height = 900,

    -- ── RENDERING ────────────────────────────────────────────────
    imlib_cache_size = 0,
    double_buffer = true,
    update_interval = 2.0,
    cpu_avg_samples = 4,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,

    -- ── TYPOGRAPHY ───────────────────────────────────────────────
    use_xft = true,
    font = 'JetBrains Mono:size=8:weight=bold',
    font0 = 'JetBrains Mono:size=7',
    font1 = 'JetBrains Mono:size=10:weight=bold',
    font2 = 'JetBrains Mono:size=6',
    override_utf8_locale = true,
    uppercase = false,

    -- ── COLORS ───────────────────────────────────────────────────
    default_color = '#111111',
    color0 = '#111111',  -- Primary text
    color1 = '#0055ff',  -- Accent blue
    color2 = '#ff3300',  -- Alert red
    color3 = '#a0a0a0',  -- Muted grey
    color4 = '#888888',  -- Inactive
    color5 = '#00aa55',  -- Accent green

    -- ── BORDERS & GRAPH ─────────────────────────────────────────
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    draw_graph_borders = true,
    default_graph_height = 28,
    default_graph_width = 440,
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    border_width = 1,

    -- ── CAIRO LUA OVERLAY ────────────────────────────────────────
    lua_load = '~/.config/conky/draw_nodes.lua',
    lua_draw_hook_pre = 'draw_network_graph',
