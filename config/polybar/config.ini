; ╔══════════════════════════════════════════════════════════════════╗
; ║  [MARKAB] POLYBAR — SYSTEM TELEMETRY HEADER                    ║
; ║  DATA-DENSE BRUTALIST STATUS / PIPE-DELIMITED MODULES          ║
; ╚══════════════════════════════════════════════════════════════════╝

[colors]
background     = #f4f4f4
foreground     = #111111
border         = #111111
inactive       = #888888
accent-blue    = #0055ff
accent-green   = #00aa55
accent-red     = #ff3300
separator      = #a0a0a0

; ── GLOBAL SETTINGS ────────────────────────────────────────────────
[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

; ── TOP BAR ────────────────────────────────────────────────────────
[bar/main]
monitor = eDP-1
width = 100%
height = 24
offset-x = 0
offset-y = 0
fixed-center = true
dpi = 0

background = ${colors.background}
foreground = ${colors.foreground}

; 1px border on all sides — brutalist frame
border-size = 1
border-color = ${colors.border}

; No rounded corners
radius = 0

; Padding inside the bar
padding-left = 1
padding-right = 1

; Module spacing
module-margin-left = 0
module-margin-right = 0

; Typography — small, dense, monospace
font-0 = JetBrains Mono:size=9:weight=bold;2
font-1 = JetBrains Mono:size=8;2

; Module layout
modules-left = system-tag sep powermenu sep workspaces sep
modules-center = window-title-main sep uptime-tag sep uptime
modules-right = cpu-tag sep cpu sep ram-tag sep ram sep battery sep brightness-tag sep brightness-main sep vol-tag sep volume sep date-tag sep date

; Bottom border acts as a divider line against the desktop
bottom = false

; Override redirect to work with i3 gaps
override-redirect = false
wm-restack = i3

; Cursor actions
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; Tray
tray-position = right
tray-padding = 4
tray-maxsize = 14
tray-background = ${colors.background}

; ── SEPARATOR MODULE ───────────────────────────────────────────────
[module/sep]
type = custom/text
content = " | "
content-foreground = ${colors.separator}
content-font = 2

; ── SYSTEM TAG (LEFT HEADER) ──────────────────────────────────────
[module/system-tag]
type = custom/text
content = " [MARKAB] SYS "
content-foreground = ${colors.background}
content-background = ${colors.foreground}
content-font = 1

; ── i3 WORKSPACES ─────────────────────────────────────────────────
[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
fuzzy-match = true

; Workspace label format
label-focused = " [%name%] "
label-focused-foreground = ${colors.accent-blue}
label-focused-background = ${colors.background}
label-focused-font = 1

label-unfocused = " %name% "
label-unfocused-foreground = ${colors.inactive}
label-unfocused-font = 2

label-visible = " %name% "
label-visible-foreground = ${colors.foreground}
label-visible-font = 2

label-urgent = " !%name%! "
label-urgent-foreground = ${colors.accent-red}
label-urgent-font = 1

label-separator = ""

; ── WINDOW TITLE ──────────────────────────────────────────────────
[module/window-title]
type = internal/xwindow
label = " %title% "
label-maxlen = 25
label-foreground = ${colors.foreground}
label-font = 2
label-empty = " [NO ACTIVE PROCESS] "
label-empty-foreground = ${colors.inactive}
label-empty-font = 2

; ── BATTERY ────────────────────────────────────────────────────────
[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = AC0
poll-interval = 5

format-charging = " [CHR] <label-charging> "
format-charging-foreground = ${colors.accent-green}
format-charging-font = 2

format-discharging = " [BAT] <label-discharging> "
format-discharging-foreground = ${colors.accent-red}
format-discharging-font = 2

format-full = " [FULL] 100% "
format-full-foreground = ${colors.foreground}
format-full-font = 2

label-charging = "%percentage%%"
label-discharging = "%percentage%%"

; ── CPU ────────────────────────────────────────────────────────────
[module/cpu-tag]
type = custom/text
content = " CPU "
content-foreground = ${colors.background}
content-background = ${colors.accent-blue}
content-font = 1

[module/cpu]
type = internal/cpu
interval = 2
label = " %percentage:2%% "
label-foreground = ${colors.foreground}
label-font = 2

; ── MEMORY ─────────────────────────────────────────────────────────
[module/ram-tag]
type = custom/text
content = " RAM "
content-foreground = ${colors.background}
content-background = ${colors.accent-green}
content-font = 1

[module/ram]
type = internal/memory
interval = 3
label = " %gb_used%/%gb_total% [%percentage_used:3%%] "
label-foreground = ${colors.foreground}
label-font = 2

; ── VOLUME ─────────────────────────────────────────────────────────
[module/vol-tag]
type = custom/text
content = " VOL "
content-foreground = ${colors.background}
content-background = ${colors.foreground}
content-font = 1

[module/volume]
type = internal/pulseaudio
use-ui-max = true
interval = 5
label-volume = " %percentage%% "
label-volume-foreground = ${colors.foreground}
label-volume-font = 2
label-muted = " MUTED "
label-muted-foreground = ${colors.accent-red}
label-muted-font = 2

; ── UPTIME ─────────────────────────────────────────────────────────
[module/uptime-tag]
type = custom/text
content = " UPTIME "
content-foreground = ${colors.background}
content-background = ${colors.foreground}
content-font = 1

[module/uptime]
type = custom/script
exec = uptime -p | sed -e 's/up //' -e 's/ weeks*, /w /' -e 's/ week*, /w /' -e 's/ days*, /d /' -e 's/ day*, /d /' -e 's/ hours*, /h /' -e 's/ hour*, /h /' -e 's/ minutes*/m/' -e 's/ minute*/m/' | tr '[:lower:]' '[:upper:]'
interval = 60
label = " %output% "
label-foreground = ${colors.foreground}
label-font = 2

; ── DATE / TIME ────────────────────────────────────────────────────
[module/date-tag]
type = custom/text
content = " CLK "
content-foreground = ${colors.background}
content-background = ${colors.accent-blue}
content-font = 1

[module/date]
type = internal/date
interval = 1
date = "%Y.%m.%d"
time = "%H:%M:%S"
label = " %date% %time% "
label-foreground = ${colors.foreground}
label-font = 1

; ── POWER MENU ─────────────────────────────────────────────────────
[module/powermenu]
type = custom/menu
expand-right = true
format-spacing = 1

label-open = " PWR "
label-open-foreground = ${colors.background}
label-open-background = ${colors.accent-red}
label-open-font = 1

label-close = " [X] CANCEL "
label-close-foreground = ${colors.accent-red}
label-close-font = 2

label-separator = " | "
label-separator-foreground = ${colors.separator}

menu-0-0 = " [R] Reboot "
menu-0-0-exec = systemctl reboot
menu-0-0-foreground = ${colors.foreground}

menu-0-1 = " [S] Shutdown "
menu-0-1-exec = systemctl poweroff
menu-0-1-foreground = ${colors.foreground}

menu-0-2 = " [B] Block Screen "
menu-0-2-exec = ~/.config/i3/lock.sh
menu-0-2-foreground = ${colors.foreground}

[bar/secondary]
inherit = bar/main
monitor = HDMI-1
tray-position = none
modules-left = system-tag sep powermenu sep workspaces sep
modules-center = window-title-secondary sep
modules-right = bluetooth-tag sep bluetooth sep temp-tag sep temp sep brightness-tag sep brightness-secondary sep network-tag sep wlan sep date-tag sep date

[module/wlan]
type = internal/network
interface = wlan0
interval = 3.0
format-connected = <label-connected>
label-connected = %essid%
label-connected-font = 2
label-disconnected = OFFLINE
label-disconnected-font = 2

[module/network-tag]
type = custom/text
content = " NET "
content-foreground = ${colors.background}
content-background = ${colors.foreground}
content-font = 1

[module/brightness-main]
type = internal/backlight
card = intel_backlight
format = <label>
label = %percentage%%
label-font = 2

[module/brightness-tag]
type = custom/text
content = " BRT "
content-foreground = ${colors.background}
content-background = ${colors.foreground}
content-font = 1

[module/window-title-main]
type = custom/script
exec = ~/.config/polybar/monitor_title.py eDP-1
interval = 0.5
format-font = 2

[module/window-title-secondary]
type = custom/script
exec = ~/.config/polybar/monitor_title.py HDMI-1
interval = 0.5
format-font = 2

[module/bluetooth-tag]
type = custom/text
content = " BT "
content-foreground = ${colors.background}
content-background = ${colors.foreground}
content-font = 1

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth_status.sh
interval = 2
format = <label>
label = %output%
label-font = 2

[module/temp-tag]
type = custom/text
content = " CPU-T "
content-foreground = ${colors.background}
content-background = ${colors.foreground}
content-font = 1

[module/temp]
type = internal/temperature
hwmon-path = /sys/class/hwmon/hwmon5/temp1_input
warn-temperature = 80
format = <label>
label = %temperature-c%
label-font = 2

[module/brightness-secondary]
type = custom/script
exec = awk '{printf "%.0f%%", $1 * 100}' ~/.cache/hdmi_brightness 2>/dev/null || echo "100%"
interval = 0.2
format = <label>
label = %output%
label-font = 2
