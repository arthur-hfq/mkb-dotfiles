# ╔══════════════════════════════════════════════════════════════════╗
# ║  [K-CORE] PICOM COMPOSITOR — FLAT BRUTALIST RENDERING          ║
# ║  NO BLUR / NO RADIUS / SHARP OFFSET SHADOW (RETRO CARDS)      ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── BACKEND ────────────────────────────────────────────────────────
backend = "glx";

# ── CORNERS: ABSOLUTE ZERO ────────────────────────────────────────
corner-radius = 0;

# ── SHADOWS: SHARP RETRO OFFSET (LAYERED CARD EFFECT) ─────────────
shadow = true;
shadow-radius = 0;
shadow-offset-x = 5;
shadow-offset-y = 5;
shadow-opacity = 0.3;
shadow-color = "#111111";

# Exclude shadows from polybar, dunst, and conky overlays
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Dunst'",
    "class_g = 'i3-frame'",
    "class_g = 'Conky'",
    "class_g ?= 'conky'",
    "window_type = 'override'",
    "_GTK_FRAME_EXTENTS@:c",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# ── BLUR: DISABLED ────────────────────────────────────────────────
blur-method = "none";
blur-size = 0;
blur-deviation = false;

# ── FADING: MINIMAL ───────────────────────────────────────────────
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 4;
no-fading-openclose = false;

fade-exclude = [
    "class_g = 'Conky'",
    "class_g ?= 'conky'"
];

# ── OPACITY ────────────────────────────────────────────────────────
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Conky'",
    "class_g ?= 'conky'"
];

# Force Conky and override windows to full opacity — let Conky handle its own ARGB
opacity-rule = [
    "100:class_g = 'Conky'",
    "100:class_g ?= 'conky'",
    "100:window_type = 'override'"
];

# ── GENERAL ────────────────────────────────────────────────────────
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = true;
use-ewmh-active-win = true;
unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";

# ── WINDOW TYPE SETTINGS ──────────────────────────────────────────
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 1.0; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { shadow = false; opacity = 1.0; };
    dropdown_menu = { shadow = false; opacity = 1.0; };
    override = { shadow = false; fade = false; opacity = 1.0; };
};
window-shader-fg = "DEFAULT_USER_HOME/.config/picom/vibrance.glsl";
